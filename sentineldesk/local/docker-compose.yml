# SentinelDesk on one server. No files to edit:
#   docker compose up -d                                                     (CPU)
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d    (NVIDIA GPU)
#   docker compose logs sentineldesk      <- shows the one-time setup link; open it in a browser
# Everything else (organisation, Jira, help articles, people) is set up in the browser.
name: sentineldesk

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.5.7}  # pin to the release you have tested
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama:/root/.ollama
    # No ports: only the sentineldesk service can reach the model.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-time download of the model weights from the Ollama library (free). Skipped when present.
  model-pull:
    image: ollama/ollama:${OLLAMA_VERSION:-0.5.7}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${SENTINEL_AGENT_MODEL:-llama3.2} && ollama pull ${SENTINEL_CHAIRMAN_MODEL:-llama3.2}"]
    restart: "no"

  sentineldesk:
    build: .
    image: sentineldesk:local
    restart: unless-stopped
    depends_on:
      model-pull:
        condition: service_completed_successfully
    env_file:
      - path: .env        # optional; see .env.example for the few advanced settings
        required: false
    environment:
      SENTINEL_OLLAMA_URL: http://ollama:11434
      SENTINEL_MODEL_HOSTS: ollama
    volumes:
      - data:/data        # database, settings, help articles and Jira token (readable only by the service)
    # Who can open the dashboard: by default only this server (put your HTTPS reverse proxy in front).
    # To let analysts on your network open http://<server>:8765 directly: SENTINEL_BIND=0.0.0.0 docker compose up -d
    ports:
      - "${SENTINEL_BIND:-127.0.0.1}:8765:8765"
    stop_grace_period: 3m  # the worker finishes the request it is on before exiting

volumes:
  ollama:
  data:
