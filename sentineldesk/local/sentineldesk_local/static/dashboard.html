<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SentinelDesk</title>
<!-- Fully offline: no CDNs, no web fonts, no analytics. Everything is in this file. -->
<style>
:root{
  --bg:#0A0E1A;--panel:#111727;--panel2:#161E31;--line:#222C45;--line2:#30406A;
  --text:#E8ECF6;--soft:#BAC2D8;--dim:#8590AE;
  --accent:#8FDCEB;--accent-ink:#06121A;--amber:#F2B66B;--red:#FF7A85;--green:#7CE8AE;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
code{font-family:var(--mono);font-size:.9em;background:#070A13;border:1px solid var(--line);border-radius:5px;padding:0 4px}
.wrap{max-width:1180px;margin:0 auto;padding:16px 18px 48px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#183A4A,#2A1E52);border:1px solid var(--line2);color:var(--accent);font-weight:700;font-size:13px;flex:none}
.brand b{font-size:17px}.brand small{display:block;color:var(--dim);font-size:12px;line-height:1.3}
nav.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
nav.tabs button{background:none;border:0;border-radius:7px;padding:6px 14px;cursor:pointer;color:var(--soft)}
nav.tabs button[aria-current=page]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.status{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--soft)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--dim);display:inline-block;flex:none}
.status.ok i{background:var(--green);box-shadow:0 0 8px var(--green)}.status.warn i{background:var(--amber)}.status.bad i{background:var(--red)}
.user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.pad{padding:18px}
h1{font-size:24px;line-height:1.25}h2{font-size:18px;line-height:1.3}
.muted{color:var(--dim)}.small{font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);border-radius:9px;padding:8px 14px;cursor:pointer;color:var(--text);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.btn.primary:hover{background:var(--amber);border-color:var(--amber)}
.btn.good{background:#16392A;border-color:#2D6A4C;color:var(--green);font-weight:600}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:progress}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
label{display:grid;gap:5px;font-size:13px;color:var(--soft);margin-bottom:14px}
label .hint{color:var(--dim);font-size:12px}
input,textarea,select{background:#070A13;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;width:100%}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>label{flex:1 1 180px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.ok-text{color:var(--green)}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line2);color:var(--soft);white-space:nowrap}
.pill.sec{color:var(--red);border-color:#6B2F3A;background:#2A1219}
.pill.P1{color:var(--red);border-color:#6B2F3A}.pill.P2{color:var(--amber);border-color:#6A4D24}.pill.P3{color:var(--accent);border-color:#24536A}.pill.P4{color:var(--soft)}
.pill.done{color:var(--green);border-color:#2D5A45}
.center{min-height:80vh;display:grid;place-items:center}
.center .card{width:min(460px,100%)}
.steps{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.steps span{font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.steps span.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.steps span.done{color:var(--green);border-color:#2D5A45}
.wizard{max-width:680px;margin:20px auto}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.choice input{width:auto;margin-top:4px;flex:none}
.choice label{margin:0;display:block;color:var(--soft)}
.choice b{display:block;font-weight:600;color:var(--text)}
.drop{border:1.5px dashed var(--line2);border-radius:12px;padding:22px;text-align:center;color:var(--soft)}
.drop.over{border-color:var(--accent);background:#0E1A24}
details.more{margin:6px 0 14px}
details.more summary,details.how summary{cursor:pointer;color:var(--accent);font-size:14px}
table.simple{width:100%;border-collapse:collapse;font-size:13.5px}
table.simple th{text-align:left;color:var(--dim);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
table.simple td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.simple select{padding:5px 8px;width:auto}
.inbox{display:grid;grid-template-columns:360px 1fr;gap:14px;align-items:start}
@media(max-width:900px){.inbox{grid-template-columns:1fr}}
.inbox>*{min-width:0}
.filters{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.filters button[data-f]{background:none;border:1px solid var(--line2);border-radius:999px;padding:4px 11px;cursor:pointer;color:var(--soft);font-size:13px}
.filters button[aria-pressed=true]{background:var(--panel2);color:var(--text);border-color:var(--accent)}
.list{list-style:none;max-height:68vh;overflow:auto}
.list li{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:4px}
.list li:hover{background:var(--panel2)}
.list li[aria-selected=true]{background:#14203A;box-shadow:inset 3px 0 0 var(--accent)}
.list .subj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .meta{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--dim);flex-wrap:wrap}
.empty{padding:28px 18px;color:var(--dim);text-align:center}
.verdict{border-radius:12px;padding:16px;margin:14px 0 8px}
.verdict.sec{background:linear-gradient(135deg,#2A1219,#1A1424);border:1px solid #6B2F3A}
.verdict.req{background:linear-gradient(135deg,#10251F,#121C2B);border:1px solid #2D5A45}
.verdict h2{font-size:20px}
.verdict.sec h2{color:#FFB3BA}
.verdict p{color:var(--soft);margin-top:6px}
.reply{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;white-space:pre-wrap;word-break:break-word}
.reply .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;white-space:normal}
.reviewbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.reviewbar>span{margin-right:auto}
.why li{margin-left:18px;color:var(--soft);font-size:14px}
details.how{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media(max-width:700px){.agents{grid-template-columns:1fr}}
.agent{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;min-width:0}
.agent b{display:block;margin-bottom:3px}
.log{list-style:none;margin-top:10px;font-size:12.5px;color:var(--soft);max-height:260px;overflow:auto;display:grid;gap:4px}
.log time{font-family:var(--mono);color:var(--dim);margin-right:8px}
.log li.alert{color:#FFB3BA}.log li.warn{color:var(--amber)}.log li.error{color:var(--red)}
.original{white-space:pre-wrap;background:#070A13;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;color:var(--soft);margin-top:8px;word-break:break-word}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:28px;font-weight:650}
.kpi span{color:var(--soft);font-size:13.5px}
.kpi small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.settings{display:grid;gap:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 16px;font-size:14px;box-shadow:0 8px 30px #0008;z-index:20;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
// ---------------------------------------------------------------- helpers
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const root = $("root");
const PRIORITY = { P1: ["Critical", "Act now: a security threat or many people stopped."], P2: ["High", "A team or a deadline is affected."], P3: ["Normal", "One person is blocked or slowed down."], P4: ["Low", "Routine request; can wait."] };
const ATTACK = { phishing: "a phishing attempt", fraud: "a fraud attempt", impersonation: "someone impersonating your company", prompt_injection: "a message trying to trick the AI", malware: "a malware link", other: "a security risk", none: "a security risk" };
const ago = (iso) => { const s = (Date.now() - new Date(iso)) / 1000; return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : new Date(iso).toLocaleDateString(); };
const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3500); }
function store(k, v) { try { v === undefined ? (v = sessionStorage.getItem(k)) : sessionStorage.setItem(k, v); } catch { /* private mode */ } return v; }

const state = { me: null, status: null, tab: "inbox", filter: "review", tickets: [], selected: null, detail: null, profile: null, health: null, settings: null };
let stream = null;
let timers = [];

async function api(path, opts = {}) {
  const method = (opts.method || "GET").toUpperCase();
  const headers = { ...(opts.body ? { "Content-Type": "application/json" } : {}), ...(method === "GET" ? {} : { "X-SentinelDesk": "1" }) };
  const res = await fetch(path, { method, headers, body: opts.body ? JSON.stringify(opts.body) : undefined, credentials: "same-origin" });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && !opts.allow401) { stop(); route(); throw new Error("Please sign in."); }
  if (!res.ok) {
    const d = data.detail;
    throw new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map((x) => `${x.loc?.at(-1)}: ${x.msg}`).join("; ") : `Something went wrong (${res.status}).`);
  }
  return data;
}
function stop() { timers.forEach(clearInterval); timers = []; if (stream) { stream.close(); stream = null; } }
async function withBusy(btn, fn) { btn.disabled = true; try { return await fn(); } finally { btn.disabled = false; } }

// ---------------------------------------------------------------- routing
async function route() {
  const status = await api("/api/setup/status", { allow401: true });
  if (status.needs_account) return screenAccount();
  state.me = await api("/api/me", { allow401: true }).catch(() => null);
  if (!state.me) return screenSignIn();
  state.status = await api("/api/setup/status");
  if (state.me.role === "admin" && !state.status.configured && !state.status.managed_by_file && store("skipWizard") !== "1") return screenWizard(0);
  return screenApp();
}

// ---------------------------------------------------------------- first account
function screenAccount() {
  const token = new URLSearchParams(location.hash.slice(1)).get("setup");
  root.innerHTML = `<div class="center"><div class="card pad">
    <div class="brand" style="margin-bottom:14px"><div class="logo">SD</div><div><b>Welcome to SentinelDesk</b><small>Let's create your administrator account.</small></div></div>
    ${token ? `<form id="f">
      <label>Username<input id="u" autocomplete="username" value="admin" required></label>
      <label>Password <span class="hint">At least 12 characters.</span><input id="p" type="password" autocomplete="new-password" required></label>
      <label>Password again<input id="p2" type="password" autocomplete="new-password" required></label>
      <button class="btn primary" id="go">Create account</button><p class="err" id="e" role="alert"></p></form>`
    : `<p>Open the setup link that was shown when SentinelDesk started. It ends with <span class="muted">#setup=…</span></p>
       <p class="muted small" style="margin-top:10px">Started with Docker? Run <code>docker compose logs sentineldesk</code> to see it again.</p>`}
  </div></div>`;
  if (!token) return;
  $("p").focus();
  $("f").onsubmit = (e) => {
    e.preventDefault();
    $("e").textContent = "";
    if ($("p").value !== $("p2").value) return void ($("e").textContent = "The two passwords are different.");
    withBusy($("go"), async () => {
      try {
        await api("/api/setup/account", { method: "POST", body: { token, username: $("u").value.trim().toLowerCase(), password: $("p").value } });
        history.replaceState(null, "", location.pathname);
        route();
      } catch (err) { $("e").textContent = err.message; }
    });
  };
}

// ---------------------------------------------------------------- sign in
function screenSignIn() {
  stop();
  root.innerHTML = `<div class="center"><div class="card pad">
    <div class="brand" style="margin-bottom:14px"><div class="logo">SD</div><div><b>Sign in to SentinelDesk</b><small>Ask your administrator if you need an account.</small></div></div>
    <form id="f"><label>Username<input id="u" autocomplete="username" required></label>
    <label>Password<input id="p" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" id="go">Sign in</button><p class="err" id="e" role="alert"></p></form></div></div>`;
  $("u").focus();
  $("f").onsubmit = (e) => {
    e.preventDefault();
    withBusy($("go"), async () => {
      try { await api("/api/login", { method: "POST", body: { username: $("u").value, password: $("p").value }, allow401: true }); route(); }
      catch (err) { $("e").textContent = err.message; }
    });
  };
}

// ---------------------------------------------------------------- forms shared by the wizard and Settings
const SUGGESTED_TEAMS = "Service Desk\nSecurity\nNetwork\nDesktop Support\nApplications";
function orgForm(s) {
  const teams = (s.teams || []).map((t) => t.name).join("\n") || SUGGESTED_TEAMS;
  return `<form id="org" onsubmit="return false">
    <label>Company name<input id="o_name" value="${esc(s.organization?.name || "")}" required placeholder="Acme Corporation"></label>
    <label>Email domains your staff use <span class="hint">Separate with commas. Look-alikes of these are flagged as impersonation.</span>
      <input id="o_domains" value="${esc((s.organization?.domains || []).join(", "))}" required placeholder="acme.com, acme.co.uk"></label>
    <label>Your teams <span class="hint">One per line, using the names your analysts use. Requests are routed to these.</span>
      <textarea id="o_teams" required>${esc(teams)}</textarea></label>
    <label>Which team handles phishing and security incidents?<select id="o_sec"></select></label>
    <p class="err" id="o_err" role="alert"></p>
  </form>`;
}
function wireOrgForm(s) {
  const fill = () => {
    const names = $("o_teams").value.split("\n").map((x) => x.trim()).filter(Boolean);
    const current = $("o_sec").value || s.organization?.security_team || names.find((n) => /secur|soc/i.test(n)) || names[0];
    $("o_sec").innerHTML = names.map((n) => `<option ${n === current ? "selected" : ""}>${esc(n)}</option>`).join("");
  };
  $("o_teams").addEventListener("input", fill);
  fill();
}
async function saveOrg() {
  $("o_err").textContent = "";
  const names = $("o_teams").value.split("\n").map((x) => x.trim()).filter(Boolean);
  const prev = Object.fromEntries((state.settings?.teams || []).map((t) => [t.name, t.handles]));
  return api("/api/settings/organization", { method: "PUT", body: {
    name: $("o_name").value.trim(), domains: $("o_domains").value.split(",").map((d) => d.trim()).filter(Boolean),
    teams: names.map((n) => ({ name: n, handles: prev[n] || "" })), security_team: $("o_sec").value } });
}

const isCloud = (url) => /\.(atlassian\.net|jira\.com)(:\d+)?(\/|$)/i.test(url.trim().replace(/^https?:\/\//, "") + "/");
function jiraForm(s) {
  const j = s.jira || {};
  const sec = s.secrets || {};
  return `<form id="jira" onsubmit="return false">
    <label>Your Jira site<input id="j_url" value="${esc(j.base_url || "")}" placeholder="yourcompany.atlassian.net"></label>
    <div id="j_cloud">
      <label>Email of the Jira account SentinelDesk will use <span class="hint">An agent on your service desk. A dedicated account is best.</span>
        <input id="j_email" type="email" value="${esc(sec.jira_email || "")}" placeholder="sentineldesk@yourcompany.com"></label>
      <label>API token for that account <span class="hint">Create one at id.atlassian.com → Security → Create and manage API tokens.${sec.jira_api_token ? ` Saved: ${esc(sec.jira_api_token)}. Leave empty to keep it.` : ""}</span>
        <input id="j_token" type="password" autocomplete="off"></label>
    </div>
    <div id="j_dc" hidden>
      <label>Personal access token <span class="hint">In Jira: your profile picture → Profile → Personal access tokens.${sec.jira_pat ? ` Saved: ${esc(sec.jira_pat)}. Leave empty to keep it.` : ""}</span>
        <input id="j_pat" type="password" autocomplete="off"></label>
    </div>
    <div class="actions"><button type="button" class="btn" id="j_test">Test connection</button><span id="j_testmsg" class="small"></span></div>
    <div id="j_more" ${j.project_key ? "" : "hidden"} style="margin-top:16px">
      <label>Which service desk should SentinelDesk watch?<select id="j_desk">${j.project_key ? `<option value="${esc(j.project_key)}">${esc(j.project_key)}</option>` : ""}</select></label>
      <div class="choice"><input type="radio" name="j_mode" value="shadow" id="m1" ${j.mode !== "read-only" ? "checked" : ""}><label for="m1"><b>Add an internal note to each new request (recommended)</b>Only your agents see it. SentinelDesk never changes the request or replies to the customer.</label></div>
      <div class="choice"><input type="radio" name="j_mode" value="read-only" id="m2" ${j.mode === "read-only" ? "checked" : ""}><label for="m2"><b>Don't write anything to Jira</b>Suggestions only appear here in SentinelDesk.</label></div>
      <label style="margin-top:10px">Also check older requests, so the report has numbers from day one?
        <select id="j_hist">${[[0, "No, only new requests"], [7, "Last 7 days"], [30, "Last 30 days"], [60, "Last 60 days"], [90, "Last 90 days"]].map(([v, t]) => `<option value="${v}" ${Number(j.history_days ?? 30) === v ? "selected" : ""}>${t}</option>`).join("")}</select>
        <span class="hint">Older requests are only read, never commented on.</span></label>
      <details class="more"><summary>Priority matching (set automatically)</summary><div id="j_prio" style="margin-top:8px"></div></details>
    </div>
    <p class="err" id="j_err" role="alert"></p>
  </form>`;
}
function wireJiraForm(s) {
  const toggle = () => { const url = $("j_url").value.trim(); const cloud = isCloud(url); $("j_cloud").hidden = !!url && !cloud; $("j_dc").hidden = !url || cloud; };
  $("j_url").addEventListener("input", toggle);
  toggle();
  let pmap = { ...(s.jira?.priority_map || {}) };
  const drawPrio = (names) => {
    $("j_prio").innerHTML = names.length ? `<table class="simple"><tr><th>Jira priority</th><th>SentinelDesk priority</th></tr>${names.map((n) => `<tr><td>${esc(n)}</td><td><select data-p="${esc(n)}">${["P1", "P2", "P3", "P4"].map((p) => `<option value="${p}" ${pmap[n] === p ? "selected" : ""}>${p} · ${PRIORITY[p][0]}</option>`).join("")}</select></td></tr>`).join("")}</table>` : `<p class="muted small">Test the connection to load your priorities.</p>`;
    $("j_prio").querySelectorAll("select").forEach((sel) => sel.addEventListener("change", () => (pmap[sel.dataset.p] = sel.value)));
  };
  drawPrio(Object.keys(pmap));
  $("j_test").onclick = () => withBusy($("j_test"), async () => {
    $("j_err").textContent = ""; $("j_testmsg").textContent = "Connecting…";
    try {
      const r = await api("/api/settings/jira/test", { method: "POST", body: jiraCreds() });
      $("j_testmsg").innerHTML = `<span class="ok-text">✓ Connected as ${esc(r.account)}</span>`;
      $("j_url").value = r.base_url;
      const current = $("j_desk").value;
      $("j_desk").innerHTML = r.service_desks.length ? r.service_desks.map((d) => `<option value="${esc(d.key)}" ${d.key === current ? "selected" : ""}>${esc(d.name)} (${esc(d.key)})</option>`).join("") : `<option value="">This account can't see any service desks. Make it an agent first.</option>`;
      for (const n of r.priorities) if (!pmap[n]) pmap[n] = r.suggested_priority_map[n];
      drawPrio(r.priorities);
      $("j_more").hidden = false;
    } catch (err) { $("j_testmsg").textContent = ""; $("j_err").textContent = err.message; }
  });
  return () => ({ ...jiraCreds(), enabled: true, project_key: $("j_desk").value, mode: document.querySelector("input[name=j_mode]:checked")?.value || "shadow", history_days: Number($("j_hist").value), priority_map: pmap });
}
function jiraCreds() {
  const url = $("j_url").value.trim();
  return isCloud(url) ? { base_url: url, email: $("j_email").value.trim() || null, api_token: $("j_token").value || null } : { base_url: url, pat: $("j_pat").value || null };
}

function kbBlock(s) {
  return `<div id="kb">
    <div class="drop" id="kb_drop"><p><b>Drop help articles here</b> or <label class="linkbtn" style="display:inline;margin:0;color:var(--accent)">choose files<input type="file" id="kb_file" multiple accept=".md,.txt,.markdown,text/plain,text/markdown" hidden></label></p>
      <p class="muted small">Markdown (.md) or text (.txt), one article per file. Suggested replies are based only on these.</p></div>
    <div id="kb_list" style="margin-top:12px">${kbList(s.kb || [])}</div><p class="err" id="kb_err" role="alert"></p></div>`;
}
function kbList(items) {
  return items.length ? `<table class="simple"><tr><th>Article</th><th></th></tr>${items.map((a) => `<tr><td>${esc(a.title)} <span class="muted small">${esc(a.id)}</span></td><td style="text-align:right"><button class="linkbtn small" data-del="${esc(a.id)}">Remove</button></td></tr>`).join("")}</table>` : `<p class="muted small">No articles yet.</p>`;
}
function wireKb() {
  const upload = async (files) => {
    $("kb_err").textContent = "";
    try {
      const payload = await Promise.all([...files].map((f) => f.text().then((content) => ({ name: f.name, content }))));
      if (!payload.length) return;
      const s = await api("/api/settings/kb", { method: "POST", body: { files: payload } });
      $("kb_list").innerHTML = kbList(s.kb); toast(`Added ${payload.length} article${payload.length === 1 ? "" : "s"}.`);
    } catch (err) { $("kb_err").textContent = err.message; }
  };
  $("kb_file").addEventListener("change", (e) => upload(e.target.files));
  const drop = $("kb_drop");
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files); });
  $("kb_list").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-del]");
    if (!b) return;
    try { const s = await api(`/api/settings/kb/${encodeURIComponent(b.dataset.del)}`, { method: "DELETE" }); $("kb_list").innerHTML = kbList(s.kb); }
    catch (err) { $("kb_err").textContent = err.message; }
  });
}

// ---------------------------------------------------------------- setup wizard
const STEPS = ["Your organisation", "Connect Jira", "Help articles", "Done"];
async function screenWizard(step) {
  stop();
  state.settings = await api("/api/settings");
  const s = state.settings;
  const bar = `<div class="steps">${STEPS.map((t, i) => `<span class="${i === step ? "on" : i < step ? "done" : ""}">${i < step ? "✓ " : ""}${i + 1}. ${t}</span>`).join("")}</div>`;
  const shell = (title, sub, body, buttons) => {
    root.innerHTML = `<div class="wizard"><div class="brand" style="margin-bottom:16px"><div class="logo">SD</div><div><b>Set up SentinelDesk</b><small>Takes about five minutes. You can change everything later in Settings.</small></div></div>
      ${bar}<div class="card pad"><h1>${title}</h1><p class="muted" style="margin:4px 0 18px">${sub}</p>${body}<div class="actions" style="margin-top:14px">${buttons}</div></div></div>`;
  };
  if (step === 0) {
    shell("Tell us about your organisation", "SentinelDesk uses this to spot fake senders and to send requests to the right team.", orgForm(s),
      `<button class="btn primary" id="next">Continue</button>`);
    wireOrgForm(s);
    $("o_name").focus();
    $("next").onclick = () => withBusy($("next"), async () => { try { await saveOrg(); screenWizard(1); } catch (err) { $("o_err").textContent = err.message; } });
  } else if (step === 1) {
    shell("Connect Jira Service Management", "SentinelDesk reads new requests and adds its suggestion as an internal note. It never replies to customers or changes requests.", jiraForm(s),
      `<button class="btn primary" id="next">Save and continue</button><button class="btn" id="skip">Skip for now</button>`);
    const read = wireJiraForm(s);
    $("j_url").focus();
    $("skip").onclick = () => screenWizard(2);
    $("next").onclick = () => withBusy($("next"), async () => {
      $("j_err").textContent = "";
      if ($("j_more").hidden) return void ($("j_err").textContent = "Press “Test connection” first.");
      try { await api("/api/settings/jira", { method: "PUT", body: read() }); screenWizard(2); } catch (err) { $("j_err").textContent = err.message; }
    });
  } else if (step === 2) {
    shell("Add your help articles", "Suggested replies quote these, so agents can trust them. Ten to thirty common fixes is a great start.", kbBlock(s),
      `<button class="btn primary" id="next">Continue</button>`);
    wireKb();
    $("next").onclick = () => screenWizard(3);
  } else {
    const j = s.jira || {};
    shell("You're all set", "SentinelDesk is running.", `<ul class="why" style="display:grid;gap:6px">
        <li>${j.enabled ? `Watching <b>${esc(j.project_key)}</b> in Jira. New requests get ${j.mode === "shadow" ? "an internal note" : "a suggestion here"} within about a minute.` : "Jira isn't connected yet. You can connect it any time in Settings, or try a request in the inbox with “+ Test a ticket”."}</li>
        <li>${(s.kb || []).length} help article${(s.kb || []).length === 1 ? "" : "s"} loaded.</li>
        <li>Add your analysts in <b>Settings → People</b>.</li></ul>`,
      `<button class="btn primary" id="next">Open the inbox</button>`);
    $("next").onclick = () => { store("skipWizard", "1"); screenApp(); };
  }
}

function screenApp() {
  stop();

function showTab(tab) {
  state.tab = tab;
  root.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  ({ inbox: renderInbox, report: renderReport, settings: renderSettings })[tab]();
}

async function refreshHealth() {
  try {
    const h = await api("/api/health");
    state.health = h;
    const o = h.ollama;
    let cls = "ok", text = "Running", title = `AI model ${o.agent_model}; ${h.queue.queued} waiting`;
    if (!h.worker.alive) { cls = "bad"; text = "Stopped: restart SentinelDesk"; title = "The background worker is not running, so new requests are not being checked."; }
    else if (!o.reachable || !o.agent_model_ready) { cls = "warn"; text = "AI offline, using rules"; title = o.error || `The AI model is not installed. Run: ollama pull ${o.agent_model}`; }
    else if (h.queue.queued > 3) { cls = "warn"; text = `Busy: ${h.queue.queued} waiting`; }
    const el = $("sys");
    if (el) { el.className = `status ${cls}`; el.title = title; el.querySelector("span").textContent = text; }
  } catch { /* signed out */ }
}

// ---------------------------------------------------------------- inbox
const verdictLine = (t) => t.status !== "done" ? (t.status === "failed" ? "Failed" : "Checking…") : t.security_flag ? "Security risk" : `${PRIORITY[t.priority]?.[0] || t.priority} · ${t.escalate_to || "Service desk"}`;
async function renderInbox() {
  $("main").innerHTML = `<div class="inbox">
    <section class="card" aria-label="Requests">
      <div class="filters" role="group" aria-label="Show">
        <button data-f="review">To review</button><button data-f="security">Security</button><button data-f="all">All</button>
        <button class="btn small" id="newbtn" style="margin-left:auto">+ Test a ticket</button>
      </div>
      <form id="newform" class="pad" hidden style="border-bottom:1px solid var(--line)">

  $("newbtn").onclick = () => { $("newform").hidden = !$("newform").hidden; if (!$("newform").hidden) $("n_from").focus(); };
  $("n_cancel").onclick = () => ($("newform").hidden = true);
  let samples = [];

  $("sample").onclick = () => { const s = samples[Math.floor(Math.random() * samples.length)]; if (s) { $("n_from").value = s.requester; $("n_subj").value = s.subject; $("n_body").value = s.body; } };
  $("newform").onsubmit = (e) => {

    $("n_err").textContent = "";
    withBusy($("n_go"), async () => {

        $("newform").reset(); $("newform").hidden = true; state.filter = "all";
        await refreshTickets(); openTicket(r.id);
      } catch (err) { $("n_err").textContent = err.message; }

  $("list").addEventListener("keydown", (e) => { const li = e.target.closest("li[data-id]"); if (li && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openTicket(Number(li.dataset.id)); } });
  await refreshTickets();

async function refreshTickets() {
  state.tickets = await api("/api/tickets?limit=200");
  drawList();
}
function drawList() {
  if (!$("list")) return;
  const t = state.tickets;
  const counts = { review: t.filter((x) => x.status === "done" && !x.review).length, security: t.filter((x) => x.security_flag).length, all: t.length };
  document.querySelectorAll("[data-f]").forEach((b) => { b.setAttribute("aria-pressed", String(b.dataset.f === state.filter)); b.textContent = `${{ review: "To review", security: "Security", all: "All" }[b.dataset.f]} (${counts[b.dataset.f]})`; });
  const shown = t.filter((x) => state.filter === "all" || (state.filter === "security" ? x.security_flag : x.status !== "done" || !x.review));
  $("list").innerHTML = shown.length ? shown.map((x) => `<li data-id="${x.id}" tabindex="0" role="option" aria-selected="${x.id === state.selected}">
      <span class="subj">${esc(x.subject)}</span>
      <span class="meta"><span class="pill ${x.security_flag ? "sec" : x.status === "done" ? esc(x.priority) : ""}">${esc(verdictLine(x))}</span>
        ${x.review ? `<span class="pill done">${x.review === "accept" ? "✓ reviewed" : "✎ changed"}</span>` : ""}
        <span>${esc(x.external_key || "")} ${ago(x.created_at)}</span></span></li>`).join("")
    : `<li class="empty" style="cursor:default">${state.filter === "review" && t.length ? "Nothing to review. Nice work!" : t.length ? "Nothing here." : "No requests yet. Once Jira is connected, new requests appear here automatically. Or press “+ Test a ticket”."}</li>`;
}
async function openTicket(id) {
  state.selected = id;
  drawList();
  const t = await api(`/api/tickets/${id}`);
  if (state.selected !== id) return;
  state.detail = t;
  drawDetail();
}
function drawDetail() {
  const t = state.detail;
  const el = $("detail");
  if (!t || !el) return;
  const head = `<h2>${esc(t.subject)}</h2><p class="muted small">From ${esc(t.requester)} · ${ago(t.created_at)}${t.external_url ? ` · <a href="${esc(t.external_url)}" target="_blank" rel="noopener noreferrer">Open ${esc(t.external_key)} in Jira</a>` : ""}${t.backfill ? " · older request, read only" : ""}</p>`;
  if (t.status !== "done") {
    el.innerHTML = head + `<div class="verdict req"><h2>${t.status === "failed" ? "Something went wrong" : "SentinelDesk is checking this request…"}</h2><p>${t.status === "failed" ? esc(t.error) : "This usually takes a few seconds."}</p></div>${howHTML(t)}`;
    return;
  }
  const f = t.final;
  const sec = t.agent_runs.find((r) => r.agent === "security" && r.output)?.output;
  const verdict = f.security_flag
    ? `<div class="verdict sec"><h2>⚠ This looks like ${esc(ATTACK[sec?.attack_type] || "a security risk")}</h2>
        <p>Sent to <b>${esc(f.escalate_to)}</b>. Don't reply to the sender, click its links, or do what it asks.</p></div>`
    : `<div class="verdict req"><h2>${esc(f.category)} → ${esc(f.escalate_to || "Service desk")}</h2>
        <p><span class="pill ${esc(f.priority)}">${esc(f.priority)} · ${esc(PRIORITY[f.priority][0])}</span> ${esc(PRIORITY[f.priority][1])}</p></div>`;
  const reasons = f.security_flag ? f.security_reasons.slice(0, 4) : [];
  const why = `<p class="small"><b>Why:</b> ${esc(f.reasoning || "Matched against your teams and help articles.")}</p>
    ${reasons.length ? `<ul class="why" style="margin-top:6px">${reasons.map((r) => `<li>${esc(r.replace(/^Prompt injection: /, "Tries to trick the AI: "))}</li>`).join("")}</ul>` : ""}
    ${f.overrides.some((o) => o.field === "security_flag") ? `<p class="small" style="margin-top:6px;color:var(--amber)">The AI missed this, so SentinelDesk's safety rules overruled it.</p>` : ""}`;
  const jiraNote = t.source === "jira" ? `<p class="small muted" style="margin-top:8px">${({ posted: "✓ Added as an internal note in Jira.", pending: "Adding an internal note in Jira…", failed: `Couldn't add the note in Jira: ${esc(t.writeback_error || "")}`, skipped: t.backfill ? "Older request: no note was added in Jira." : "Read-only mode: nothing was written to Jira." })[t.writeback_status] || ""}</p>` : "";
  const reply = `<div class="reply"><div class="head"><b class="small">${f.security_flag ? "Note for your security team" : "Suggested reply"}</b><button class="btn small" id="copy">Copy</button></div>${esc(f.suggested_response)}${f.kb_refs.length && !f.security_flag ? `<p class="small muted" style="margin-top:8px">Based on help article${f.kb_refs.length > 1 ? "s" : ""} ${esc(f.kb_refs.join(", "))}.</p>` : ""}</div>`;
  const fb = t.feedback;
  const review = `<div class="reviewbar">
      ${fb ? `<span class="small ${fb.verdict === "accept" ? "ok-text" : ""}">${fb.verdict === "accept" ? "✓" : "✎"} ${esc(fb.username)} ${fb.verdict === "accept" ? "said this was right" : `changed it to ${esc(fb.priority)} · ${esc(fb.escalate_to || "Service desk")}${fb.security_flag ? " · security" : ""}`}</span>` : `<span class="small muted">Is this right?</span>`}
      <button class="btn good" id="accept">✓ Looks right</button><button class="btn" id="change">✎ Change…</button></div>
    <form id="changeform" hidden class="card pad" style="margin-top:10px;background:var(--panel2)">
      <div class="row"><label>Priority<select id="c_p">${["P1", "P2", "P3", "P4"].map((p) => `<option value="${p}" ${p === f.priority ? "selected" : ""}>${p} · ${PRIORITY[p][0]}</option>`).join("")}</select></label>
        <label>Team<select id="c_t"><option value="">Service desk</option>${(state.profile?.teams || []).map((n) => `<option ${n === f.escalate_to ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label></div>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="c_s" style="width:auto" ${f.security_flag ? "checked" : ""}> This is a security issue (phishing, fraud…)</label>
      <label>Note <span class="hint">Optional: what should it have noticed?</span><input id="c_n" maxlength="1000"></label>
      <div class="actions"><button class="btn primary" id="c_go">Save</button><button type="button" class="btn" id="c_cancel">Cancel</button></div><p class="err" id="c_err"></p></form>`;
  el.innerHTML = head + verdict + why + reply + jiraNote + review + howHTML(t);
  $("copy").onclick = async () => { try { await navigator.clipboard.writeText(f.suggested_response); toast("Copied."); } catch { toast("Select the text and copy it."); } };
  $("accept").onclick = () => withBusy($("accept"), () => sendReview({ verdict: "accept" }).catch((err) => toast(err.message)));
  $("change").onclick = () => { $("changeform").hidden = false; $("c_p").focus(); };
  $("c_cancel").onclick = () => ($("changeform").hidden = true);
  $("changeform").onsubmit = (e) => {
    e.preventDefault();
    const category = $("c_s").checked ? "Security Incident" : f.category === "Security Incident" ? "Other" : f.category;
    withBusy($("c_go"), () => sendReview({ verdict: "correct", priority: $("c_p").value, escalate_to: $("c_t").value, security_flag: $("c_s").checked, category, note: $("c_n").value || null }).catch((err) => ($("c_err").textContent = err.message)));
  };
}
async function sendReview(body) {
  await api(`/api/tickets/${state.detail.id}/feedback`, { method: "POST", body });
  toast(body.verdict === "accept" ? "Thanks, marked as right." : "Thanks, your correction is saved.");
  await refreshTickets();
  const next = state.filter === "review" && state.tickets.find((x) => x.status === "done" && !x.review);
  openTicket(next ? next.id : state.detail.id);
}
function howHTML(t) {
  const run = (a) => t.agent_runs.find((r) => r.agent === a);
  const card = (a, title, text) => { const r = run(a); return `<div class="agent"><b>${title}</b>${r ? (r.output ? esc(text(r.output)) : `<span class="muted">No answer (${esc(r.error || "error")})</span>`) : `<span class="muted">${t.mode === "rules" ? "Not used: decided by rules" : "Waiting…"}</span>`}</div>`; };
  return `<details class="how"><summary>How SentinelDesk decided</summary>
    <p class="small muted" style="margin-top:8px">${t.mode === "council" ? `Three AI checks ran side by side (${esc(t.model)}), a fourth combined them, and safety rules checked the result.` : t.mode === "rules" ? `Decided by SentinelDesk's built-in rules${t.fallback_reason ? ` (${esc(t.fallback_reason)})` : ""}.` : "Not finished yet."}</p>
    <div class="agents">
      ${card("security", "Security check", (o) => `${o.is_attack ? "Attack" : "No attack"} (${Math.round(o.confidence * 100)}% sure). ${o.summary}`)}
      ${card("sentiment", "Urgency check", (o) => `${o.sentiment}, ${o.urgency} urgency, affects ${o.people_affected}. ${o.summary}`)}
      ${card("intent", "What they need", (o) => `${o.intent} → ${o.suggested_team}`)}
    </div>
    ${t.final?.overrides?.length ? `<p class="small" style="margin-top:10px"><b>Safety rules changed:</b> ${t.final.overrides.map((o) => esc(o.reason)).join(" ")}</p>` : ""}
    <details class="more" style="margin-top:10px"><summary>Original message</summary><div class="original">${esc(t.body)}</div></details>
    <details class="more"><summary>Activity log</summary><ul class="log">${t.events.map((e) => `<li class="${esc(e.level)}"><time>${clock(e.ts)}</time>${esc(e.message)}</li>`).join("")}</ul></details>
  </details>`;
}

  $("main").innerHTML = `<div class="settings">
    ${ro ? `<div class="card pad"><b>These settings are managed in a file</b><p class="muted small">${esc(s.path)}. Edit that file to change them; it is reloaded automatically.</p></div>` : ""}
    <section class="card pad"><h2>Organisation</h2><p class="muted small" style="margin-bottom:12px">Your domains and teams.</p>${orgForm(s)}${ro ? "" : `<button class="btn primary" id="o_save">Save</button>`}</section>
    <section class="card pad"><h2>Jira</h2><p class="muted small" style="margin-bottom:12px">${s.jira.enabled ? `Connected: watching <b>${esc(s.jira.project_key)}</b> (${s.jira.mode === "shadow" ? "adding internal notes" : "read-only"}).` : "Not connected."}</p>
      ${jiraForm(s)}${ro ? "" : `<div class="actions"><button class="btn primary" id="j_save">Save</button>${s.jira.enabled ? `<button class="btn" id="j_off">Stop using Jira</button>` : ""}</div>`}</section>
    <section class="card pad"><h2>Help articles</h2><p class="muted small" style="margin-bottom:12px">${s.kb.length} article${s.kb.length === 1 ? "" : "s"}. Suggested replies are based only on these.</p>${ro ? kbList(s.kb) : kbBlock(s)}</section>
    <section class="card pad"><h2>People</h2><div id="people"></div>
      <form id="addu" class="row" style="margin-top:12px;align-items:flex-end">
        <label>Username<input id="u_name" required></label><label>Temporary password <span class="hint">12+ characters; share it privately.</span><input id="u_pw" required minlength="12"></label>
        <label>Role<select id="u_role"><option value="analyst">Analyst</option><option value="admin">Administrator</option></select></label>
        <div style="margin-bottom:14px"><button class="btn primary" id="u_go">Add person</button></div></form><p class="err" id="u_err"></p></section>
    <section class="card pad"><h2>System</h2><div id="sysinfo" class="small"></div></section>
  </div>`;
  wireOrgForm(s);
  const readJira = wireJiraForm(s);
  if (!ro) {
    $("o_save").onclick = () => withBusy($("o_save"), async () => { try { await saveOrg(); toast("Saved."); api("/api/profile").then((p) => { state.profile = p; $("orgname").textContent = p.name; }); } catch (err) { $("o_err").textContent = err.message; } });
    $("j_save").onclick = () => withBusy($("j_save"), async () => {
      $("j_err").textContent = "";
      if ($("j_more").hidden) return void ($("j_err").textContent = "Press “Test connection” first.");
      try { await api("/api/settings/jira", { method: "PUT", body: readJira() }); toast("Saved. SentinelDesk picks this up within a few seconds."); renderSettings(); } catch (err) { $("j_err").textContent = err.message; }
    });
    if ($("j_off")) $("j_off").onclick = () => withBusy($("j_off"), async () => { await api("/api/settings/jira", { method: "PUT", body: { base_url: s.jira.base_url, enabled: false } }); toast("Jira turned off. Nothing more will be written."); renderSettings(); });
    wireKb();
  }
  const drawPeople = async () => {
    const users = await api("/api/users");
    $("people").innerHTML = `<table class="simple"><tr><th>Name</th><th>Role</th><th>Last sign-in</th><th></th></tr>${users.map((u) => `<tr><td>${esc(u.username)}</td><td>${u.role === "admin" ? "Administrator" : "Analyst"}</td><td>${u.disabled ? "<span class='muted'>access removed</span>" : u.last_login ? ago(u.last_login) : "never"}</td><td style="text-align:right">${u.disabled || u.username === state.me.username ? "" : `<button class="linkbtn small" data-off="${esc(u.username)}">Remove access</button>`}</td></tr>`).join("")}</table>`;
  };
  $("people").addEventListener("click", async (e) => { const b = e.target.closest("[data-off]"); if (b && confirm(`Remove access for ${b.dataset.off}?`)) { await api(`/api/users/${encodeURIComponent(b.dataset.off)}/disable`, { method: "POST" }); drawPeople(); } });
  $("addu").onsubmit = (e) => { e.preventDefault(); withBusy($("u_go"), async () => { $("u_err").textContent = ""; try { await api("/api/users", { method: "POST", body: { username: $("u_name").value.trim().toLowerCase(), password: $("u_pw").value, role: $("u_role").value } }); $("addu").reset(); toast("Added. Share the username and temporary password with them privately."); drawPeople(); } catch (err) { $("u_err").textContent = err.message; } }); };
  drawPeople();
  const h = state.health || (await api("/api/health"));
  $("sysinfo").innerHTML = `<table class="simple">
    <tr><td>AI model</td><td>${h.ollama.reachable ? (h.ollama.agent_model_ready ? `<span class="ok-text">Ready</span> (${esc(h.ollama.agent_model)})` : `Not installed. Run <code>ollama pull ${esc(h.ollama.agent_model)}</code>`) : `<span style="color:var(--amber)">Offline</span>: requests are decided by rules until it is back.`}</td></tr>
    <tr><td>Worker</td><td>${h.worker.alive ? `<span class="ok-text">Running</span>` : `<span style="color:var(--red)">Stopped</span>: restart SentinelDesk.`}</td></tr>
    <tr><td>Queue</td><td>${h.queue.queued} waiting, ${h.queue.running} in progress, ${h.queue.done} done${h.queue.failed ? `, ${h.queue.failed} failed` : ""}</td></tr>
    <tr><td>Database</td><td><code>${esc(h.db)}</code></td></tr></table>`;
}

// ---------------------------------------------------------------- live updates
function connectStream() {
  if (stream) stream.close();
  const es = new EventSource("/api/stream");
  stream = es;
  let pending = null;
  es.addEventListener("log", (msg) => {
    const e = JSON.parse(msg.data);
    if (state.tab !== "inbox") return;
    clearTimeout(pending);
    pending = setTimeout(async () => {
      await refreshTickets().catch(() => {});
      const editing = $("changeform") && !$("changeform").hidden;  // never redraw under someone's cursor
      if (e.ticket_id != null && e.ticket_id === state.selected && !editing) openTicket(state.selected);
    }, 300);
  });
  es.addEventListener("logout", () => { es.close(); route(); });
  es.onerror = () => { es.close(); if (stream === es) { stream = null; setTimeout(() => state.me && connectStream(), 3000); } };
}

// Pasting the setup link into a tab that is already open only changes the #fragment, which does not
// reload the page, so react to it explicitly.
window.addEventListener("hashchange", () => { if (location.hash.includes("setup=")) route(); });
route();
</script>
