<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tasks{% endblock %}</title>
  <style>
    :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e3e0; --accent:#2f6fde; --danger:#c43d3d; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141416; --card:#1e1e21; --ink:#ececee; --muted:#9a9aa1; --line:#2e2e33; --accent:#6c9bff; --danger:#ff7a7a; } }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    a { color: var(--accent); }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
    h1 { font-size: 1.5rem; margin: 0; }
    .flash { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); padding:8px 12px; border-radius:6px; margin-bottom:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px; display:flex; gap:12px; align-items:flex-start; }
    .card.done .title { text-decoration: line-through; color: var(--muted); }
    .grow { flex:1; min-width:0; }
    .notes { color:var(--muted); font-size:.9rem; white-space:pre-wrap; overflow-wrap:anywhere; }
    .tag { font-size:.75rem; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
    .tag.high { border-color: var(--danger); color: var(--danger); }
    form.inline { display:inline; margin:0; }
    button, .btn { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block; }
    .btn.primary, button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button.danger { color: var(--danger); }
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    input[type=text], input[type=search], textarea, select { font:inherit; width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
    label { display:block; margin:12px 0 4px; font-weight:600; }
    .error { color: var(--danger); font-size:.9rem; }
  </style>
</head>
<body>
<main>
  {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
