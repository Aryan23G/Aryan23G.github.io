[project]
name = "querypilot-workbench"
version = "1.0.0"
description = "Deterministic Text-to-SQL agent: LangGraph state machine, SQLGlot static guard, schema RAG, read-only SQLAlchemy execution."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.6.0",
  "langgraph>=1.0.0",
  "sqlglot>=27.0.0",
  "sqlalchemy>=2.0.36",
  "qdrant-client>=1.15.0",
  "fastapi>=0.120.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]

[project.optional-dependencies]
# Production embeddings (ONNX bge-small, downloaded on first use).
fastembed = ["fastembed>=0.7.0"]
# OpenLLMetry auto-instrumentation (LangGraph + Anthropic) via Traceloop.
openllmetry = ["traceloop-sdk>=0.47.0"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "mypy>=1.13", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["tests/"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]
