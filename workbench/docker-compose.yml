# Full stack: Qdrant (schema index) + FastAPI agent + Next.js workbench.
# The LLM is any OpenAI-compatible endpoint; by default Ollama running on the host:
#   ollama pull qwen2.5-coder:7b && docker compose up --build
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]

  api:
    build: ./backend
    environment:
      QP_LLM_BASE_URL: ${QP_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      QP_LLM_MODEL: ${QP_LLM_MODEL:-qwen2.5-coder:7b}
      QP_LLM_API_KEY: ${QP_LLM_API_KEY:-}
      QP_QDRANT_URL: http://qdrant:6333
      QP_CORS_ORIGINS: '["http://localhost:3000"]'
      QP_OTEL_EXPORTER: ${QP_OTEL_EXPORTER:-none}
      QP_OTEL_ENDPOINT: ${QP_OTEL_ENDPOINT:-}
      QP_OTEL_HEADERS: ${QP_OTEL_HEADERS:-}
      QP_API_TOKEN: ${QP_API_TOKEN:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    depends_on: [qdrant]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_TOKEN: ${QP_API_TOKEN:-}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  qdrant:
